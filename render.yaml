services:
  - type: web
    name: smart-census-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-census-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: SMS_PROVIDER
        value: twilio
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: FRONTEND_ORIGINS
        value: https://smart-census.vercel.app
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: smart-census-db
    databaseName: smart_census
    user: smart_census
    plan: basic-256mb
    region: singapore
